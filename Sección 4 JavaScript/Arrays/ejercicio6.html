<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    
</body>
<script>
    let numeros = [];

    

    for (let i = 0; i <= 2; i++) {
        let valor = Number(prompt(`Introduce el número ${i + 1}:`));
        numeros.push(valor);
    }

    let menor = numeros[0];

    for (let i = 1; i < numeros.length; i++) {
        if (numeros[i] < menor) {
        menor = numeros[i];
        }
    }

    prompt("El número menor es:", menor);
</script>
</html>
