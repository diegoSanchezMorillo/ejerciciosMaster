<body>
    <div id="mensaje"></div>

    <script>

        let nombre = prompt("Ingresa tu nombre");

        const mostrar = document.getElementById("mensaje");
        /*
        if (edad >= 18){
            mostrar.innerHTML = `<p>Hola ${nombre}, eres mayor de edad`</p>;
        }else{
            mostrar.innerHTML = `<p>Hola ${nombre}, eres menor de edad</p>`;
        }*/

        let mensaje = edad >= 18 ? `<p>Hola ${nombre}, eres mayor de edad</p>` : `<p>Hola ${nombre}, eres menor de edad</p>`;
        mostrar.innerHTML = mensaje;
    </script>
</body>
