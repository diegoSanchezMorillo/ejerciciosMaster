<script>
    let opcion = Number(window.prompt(` Seleccione una opción del Menú:
    1. Opción 1 
    2. Opción 2 
    3. Opción 3
    `));

    if(opcion==1){
        window.prompt("Ha seleccionado la opción 1");
    }
    else if(opcion==2){
        window.prompt("Ha seleccionado la opción 2");
    }
   else if(opcion==3){
        window.prompt("Ha seleccionado la opción 3");
    }
    else{
        window.prompt("No ha selecionado ninguna opción válida");
    }
</script>
