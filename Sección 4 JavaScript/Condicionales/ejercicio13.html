<script>
    let frase = window.prompt("Ingrese la frase");

    if(frase.length%2== 0){
        let media = Math.floor(frase.length/2);
        let centro = frase.charAt(media);
        window.prompt(`${centro}${frase.charAt(media+1)}`);

    }else{
        let media = Math.floor(frase.length/2);
        let centro = frase.charAt(media);
        window.prompt(centro);
    }
</script>
</html>
