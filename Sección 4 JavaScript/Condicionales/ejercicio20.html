<!DOCTYPE html>

<script>
    let temperatura = Number(window.prompt("Ingresa la temperatura"));
    let tipo = window.prompt("Si quieres convertirlo a grados centígrados pulsa C y si quieres convertirlo a grados farenheit pulsa F")

    let farenheit = 0;
    let grados = 0;

    switch (tipo){
        case "C":
            grados = ((temperatura*9)/5)+32;
            window.prompt(grados);
            break;
        case "F":
            farenheit = ((temperatura-32)*5)/9;
            window.prompt(farenheit);
            break;
        default: 
            window.prompt("No has seleccionado ninguna opción correcta");
    }
</script>
</html>
