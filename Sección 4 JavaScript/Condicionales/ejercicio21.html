<script>
    let nombre = window.prompt("Ingresa tu nombre");
    let venta = Number(window.prompt("Ingresa la cantidad de venta"));
    let extra = 0;

    if (venta >= 500){
        extra = venta * 0.05;
        window.prompt(`${nombre} ha vendido la cantidad de ${venta} y tiene de extra ${extra}`);
    }else{
        window.prompt(`${nombre} ha vendido la cantidad de ${venta}`);
    }
</script>
