<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <div class="container py-4">
    <header class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 border-bottom pb-3">
      <h1 class="h2 text-success font-monospace m-0">🪙 Crypto Tracker</h1>
      <button id="btn-refresh" class="btn btn-outline-success mt-3 mt-md-0">🔄 Actualizar Precios</button>
    </header>

    <!-- Buscador -->
    <div class="row g-2 mb-4 justify-content-center">
      <div class="col-md-8">
        <input type="text" id="search-input" class="form-control form-control-lg bg-secondary text-light border-0" placeholder="Buscar criptomonedas (ej: Bitcoin, ETH, Solana)...">
      </div>
    </div>

    <!-- Indicador de Carga -->
    <div id="spinner" class="text-center d-none my-5">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <!-- Tabla de Criptomonedas -->
    <div class="table-responsive">
      <table class="table table-dark table-hover align-middle">
        <thead>
          <tr>
            <th scope="col"># Posición</th>
            <th scope="col">Nombre</th>
            <th scope="col">Precio (USD)</th>
            <th scope="col">Cambio (24h)</th>
            <th scope="col">Cap. de Mercado</th>
          </tr>
        </thead>
        <tbody id="crypto-table-body">
          <!-- Se inyectan filas dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
