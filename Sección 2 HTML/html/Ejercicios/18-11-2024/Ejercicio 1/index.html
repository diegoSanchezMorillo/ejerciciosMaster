<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <main>
        <!-- START FORM-->
        <form action="" method="post" class="register" id="registerForm">

            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Introduce tu nombre" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" name="apellidos" id="apellidos" placeholder="Introduce tus apellidos" required>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="email@ejemplo.com" required>

            <label for="contraseña">Contraseña:</label>
            <input type="password" name="contraseña" id="contraseña" minlength="8" required>

            <button type="submit">Enviar</button>

        </form>
        <!-- END FORM-->
    </main>

    <script>

        const form = document.getElementById('registerForm')

        form.addEventListener('submit', function(event){
            event.preventDefault();
            //Obtenemos los datos del formulario
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;
            const email = document.getElementById('email').value;
            const contraseña = document.getElementById('contraseña').value;
            //Mostramos los datos del formulario
            console.log('Nombre:', nombre);
            console.log('Apellidos:', apellidos);
            console.log('Email:', email);
            console.log('Contraseña:', contraseña);
        });
    </script>
    
</body>
</html>
