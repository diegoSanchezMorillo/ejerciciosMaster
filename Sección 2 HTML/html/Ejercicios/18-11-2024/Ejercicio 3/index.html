<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
      <!-- START FORM-->
        <form action="" method="post" class="register" id="registerForm">

            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" placeholder="Introduce tu nombre" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" name="apellidos" id="apellidos" placeholder="Introduce tus apellidos" required>

            <label for="fecha">Fercha de reserva:</label>
            <input type="date" name="fecha" id="fecha" required>
            <div>
                <label for="condiciones">Aceptar condiciones:</label>
                <input type="checkbox" name="condiciones" id="condiciones" required>
            </div>
            

            <button type="submit">Enviar</button>

        </form>
        <!-- END FORM-->
</body>
</html>
