<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <!-- Degradado Verde Esmeralda (Confianza / Fortunas) -->
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Degradado Oro (Premios / Suerte) -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Sombra suave -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ISOTIPO (Bola de Lotería + Trébol de 4 Hojas) -->
  <g transform="translate(10, 10)">
    <!-- Bola de lotería base -->
    <circle cx="50" cy="50" r="46" fill="url(#emerald)" filter="url(#soft-shadow)"/>
    
    <!-- Anillo interno -->
    <circle cx="50" cy="50" r="38" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    
    <!-- Trébol estilizado -->
    <g fill="url(#gold)" filter="url(#soft-shadow)">
      <path d="M 50,22 C 44,22 38,27 38,34 C 38,41 46,46 50,50 C 54,46 62,41 62,34 C 62,27 56,22 50,22 Z" />
      <path d="M 50,78 C 44,78 38,73 38,66 C 38,59 46,54 50,50 C 54,54 62,59 62,66 C 62,73 56,78 50,78 Z" />
      <path d="M 22,50 C 22,44 27,38 34,38 C 41,38 46,46 50,50 C 46,54 41,62 34,62 C 27,62 22,56 22,50 Z" />
      <path d="M 78,50 C 78,44 73,38 66,38 C 59,38 54,46 50,50 C 54,54 59,62 66,62 C 73,62 78,56 78,50 Z" />
      <circle cx="50" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    
    <!-- Destello de suerte -->
    <path d="M 85,15 L 87,20 L 92,22 L 87,24 L 85,29 L 83,24 L 78,22 L 83,20 Z" fill="#FBBF24"/>
  </g>

  <!-- LOGOTIPO (Texto) -->
  <g transform="translate(120, 35)">
    <!-- Nombre de la web -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A">
      Loto<tspan fill="url(#gold)">Suerte</tspan>
    </text>

    <!-- Subtítulo / Tagline -->
    <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3.5">
      LOTERÍAS ONLINE
    </text>
  </g>
</svg>
